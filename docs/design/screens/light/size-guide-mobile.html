<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CRUE Light Size guide (mobile)</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F3F3F1;font-family:'Archivo',Helvetica,sans-serif;color:#0B0B0C}
a{color:inherit}a:hover{opacity:.75}
.press:active{transform:scale(.98)}

</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F3F1">
<header style="height: 60px; background: #F3F3F1; border-bottom: 1px solid #D2D2CE; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; box-sizing: border-box">
<a href="menu-mobile.html" aria-label="Menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #0B0B0C; cursor: pointer; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h18M3 16h18"></path></svg></a>
<a href="home-mobile.html" aria-label="CRUE home" style="display: flex"><img src="/brand/crue-wordmark-black.png" alt="CRUE" style="width: 86px; height: 18px; display: block"></a>
<div style="display: flex">
<a href="search-mobile.html" aria-label="Search" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #0B0B0C; cursor: pointer; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg></a>
<a href="bag-mobile.html" aria-label="Bag, 2 items" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #0B0B0C; cursor: pointer; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 8h14l-1 13H6L5 8z"></path><path d="M9 8V6a3 3 0 016 0v2"></path></svg></a>
</div>
</header><div aria-hidden="true" style="padding: 28px 16px; display: flex; flex-direction: column; gap: 20px"><div style="width: 200px; height: 36px; background: #E8E8E5"></div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><div style="height: 230px; background: #E8E8E5"></div><div style="height: 230px; background: #E8E8E5"></div><div style="height: 230px; background: #E8E8E5"></div><div style="height: 230px; background: #E8E8E5"></div></div></div><div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(28,28,26,0.38)"></div><div role="dialog" aria-label="Size guide" style="position: absolute; left: 0; bottom: 0; width: 390px; height: 780px; border-top: 1px solid #CFCFCB; background: #F3F3F1; display: flex; flex-direction: column">
<div style="height: 68px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 20px; border-bottom: 1px solid #D2D2CE"><h2 style="margin: 0; font-size: 20px; font-weight: 800; font-stretch: 125%; text-transform: uppercase">Size guide</h2><a href="product-mobile.html" aria-label="Close size guide" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #0B0B0C; cursor: pointer; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6L6 18"></path></svg></a></div>
<div style="flex-grow: 1; overflow-y: auto; padding: 24px 20px 32px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px"><div role="tablist" aria-label="Category" style="display: flex; border: 1px solid #B5B5B0"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="height: 40px; padding: 0 16px; border: 0; background: {{t.bg}}; color: {{t.fg}}; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer">{{t.label}}</button></sc-for></div><div role="group" aria-label="Units" style="display: flex; border: 1px solid #B5B5B0"><sc-for list="{{units}}" as="u" hint-placeholder-count="2"><button type="button" aria-pressed="{{u.on}}" onClick="{{u.pick}}" style="height: 40px; padding: 0 16px; border: 0; background: {{u.bg}}; color: {{u.fg}}; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer">{{u.label}}</button></sc-for></div></div>
<table style="width: 100%; border-collapse: collapse; font-size: 14px">
<thead><tr style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #55555A; text-align: left"><th scope="col" style="padding: 0 0 12px; font-weight: 400">Size</th><th scope="col" style="padding: 0 0 12px; font-weight: 400">{{c1}}</th><th scope="col" style="padding: 0 0 12px; font-weight: 400">{{c2}}</th><th scope="col" style="padding: 0 0 12px; font-weight: 400">{{c3}}</th></tr></thead>
<tbody><sc-for list="{{rows}}" as="r" hint-placeholder-count="6"><tr style="border-top: 1px solid #D2D2CE"><th scope="row" style="padding: 14px 0; text-align: left; font-weight: 700; font-stretch: 112%">{{r.size}}</th><td style="padding: 14px 0; font-family: 'IBM Plex Mono', monospace; color: #3A3A3E">{{r.a}}</td><td style="padding: 14px 0; font-family: 'IBM Plex Mono', monospace; color: #3A3A3E">{{r.b}}</td><td style="padding: 14px 0; font-family: 'IBM Plex Mono', monospace; color: #3A3A3E">{{r.c}}</td></tr></sc-for></tbody>
</table>
<div style="display: flex; flex-direction: column; gap: 14px; padding-top: 8px"><h3 style="margin: 0; font-size: 14px; font-weight: 800; font-stretch: 125%; text-transform: uppercase; letter-spacing: 0.04em">How to measure</h3>
<div style="display: grid; grid-template-columns: repeat(1, minmax(0, 1fr)); gap: 16px"><sc-for list="{{how}}" as="h" hint-placeholder-count="3"><div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 700; font-stretch: 112%; text-transform: uppercase">{{h.t}}</span><span style="font-size: 13px; line-height: 1.55; color: #3A3A3E">{{h.d}}</span></div></sc-for></div>
<p style="margin: 0; font-size: 13px; color: #55555A">[Fit note: for example, true to size; size up for a relaxed fit.]</p></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { tab: 'Tops', unit: 'cm' }; }
renderVals() {
const s = this.state;
const cols = s.tab === 'Tops' ? ['Chest', 'Waist', 'Length'] : ['Waist', 'Hip', 'Inseam'];
const v = s.unit === 'cm' ? '[cm]' : '[in]';
const rows = ['XS', 'S', 'M', 'L', 'XL', 'XXL'].map((z) => ({ size: z, a: v, b: v, c: v }));
const seg = (cur, val, key) => ({ label: val, on: cur === val, bg: cur === val ? '#0B0B0C' : 'transparent', fg: cur === val ? '#F3F3F1' : '#0B0B0C', pick: () => this.setState({ [key]: val }) });
const how = s.tab === 'Tops'
? [{ t: 'Chest', d: 'Measure around the fullest part of your chest, keeping the tape level under your arms.' }, { t: 'Waist', d: 'Measure around your natural waist, the narrowest part of your torso.' }, { t: 'Length', d: 'Measured on the garment, from the highest point of the shoulder to the hem.' }]
: [{ t: 'Waist', d: 'Measure around your natural waist, the narrowest part of your torso.' }, { t: 'Hip', d: 'Stand with feet together and measure around the fullest part of your hips.' }, { t: 'Inseam', d: 'Measure from the top of your inner thigh down to your ankle.' }];
return { c1: cols[0], c2: cols[1], c3: cols[2], rows, how,
tabs: ['Tops', 'Bottoms'].map((t) => seg(s.tab, t, 'tab')),
units: ['cm', 'in'].map((u) => seg(s.unit, u, 'unit')) };
}
}
</script>
</body>
</html>
