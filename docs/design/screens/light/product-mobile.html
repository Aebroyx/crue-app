<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CRUE Light Horizon Shell Jacket (mobile)</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F3F3F1;font-family:'Archivo',Helvetica,sans-serif;color:#0B0B0C}
a{color:inherit}a:hover{opacity:.75}
.rail{scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.press:active{transform:scale(.98)}
</style>
</helmet>
<div style="width: 390px; height: 1560px; position: relative; background: #F3F3F1; overflow: hidden">

<div style="height: 32px; background: #E8E8E5; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase">Drop 001, out now</div>

<header style="height: 60px; border-bottom: 1px solid #D2D2CE; display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
<a href="home-mobile.html" aria-label="Back to home" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0B0B0C"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 12H4M10 6l-6 6 6 6"></path></svg></a>
<a href="home-mobile.html" aria-label="CRUE home" style="display: flex"><img src="/brand/crue-wordmark-black.png" alt="CRUE" style="width: 86px; height: 18px; display: block"></a>
<button type="button" aria-label="Bag, {{bagCount}} items" style="width: 44px; height: 44px; position: relative; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #0B0B0C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 8h14l-1 13H6L5 8z"></path><path d="M9 8V6a3 3 0 016 0v2"></path></svg><sc-if value="{{hasBag}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: 6px; top: 6px; min-width: 16px; height: 16px; border-radius: 8px; background: #0B0B0C; color: #F3F3F1; font-family: 'IBM Plex Mono', monospace; font-size: 10px; display: flex; align-items: center; justify-content: center">{{bagCount}}</span></sc-if></button>
</header>

<!-- TODO: product shots on dark seamless: front, back, detail, on body -->
<div class="rail" style="display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0">
<sc-for list="{{shots}}" as="s" hint-placeholder-count="4">
<div style="flex-shrink: 0; width: 360px; height: 480px; scroll-snap-align: start; background: {{swatchBg}}; display: flex; align-items: center; justify-content: center">
<img src="/brand/crue-mark-black.png" alt="{{s.alt}}" style="width: 96px; height: 32px; opacity: 0.08">
</div>
</sc-for>
</div>
<div style="display: flex; gap: 6px; padding: 16px 20px 0">
<span style="width: 20px; height: 2px; background: #0B0B0C"></span>
<span style="width: 20px; height: 2px; background: #B5B5B0"></span>
<span style="width: 20px; height: 2px; background: #B5B5B0"></span>
<span style="width: 20px; height: 2px; background: #B5B5B0"></span>
</div>

<main style="padding: 28px 20px 0; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 12px">
<nav aria-label="Breadcrumb" style="display: flex; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #55555A">
<a href="home-mobile.html" style="text-decoration: none">Run</a><span>/</span><a href="home-mobile.html" style="text-decoration: none">Layers</a>
</nav>
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px">
<h1 style="margin: 0; font-size: 26px; line-height: 1.02; font-weight: 800; font-stretch: 125%; text-transform: uppercase">Horizon Shell Jacket</h1>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; padding-top: 4px; white-space: nowrap">[PRICE]</span>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.6; color: #3A3A3E; text-wrap: pretty">[Short product story: the one reason this jacket exists, in two lines.]</p>
</div>

<fieldset style="border: 0; margin: 0; padding: 0">
<legend style="padding: 0; margin-bottom: 12px; font-size: 13px; color: #3A3A3E">Colour: <span style="color: #0B0B0C; font-weight: 600">{{colorName}}</span></legend>
<div style="display: flex; gap: 10px">
<sc-for list="{{colors}}" as="c" hint-placeholder-count="3">
<button type="button" aria-label="{{c.name}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="width: 48px; height: 48px; padding: 3px; background: transparent; border: 1px solid {{c.ring}}; cursor: pointer"><span style="display: block; width: 40px; height: 40px; background: {{c.hex}}; border: 1px solid #B5B5B0"></span></button>
</sc-for>
</div>
</fieldset>

<fieldset aria-label="Size" style="border: 0; margin: 0; padding: 0">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px">
<span style="font-size: 13px; color: #3A3A3E">Size</span>
<a href="#guide-m" style="font-size: 13px; text-underline-offset: 4px; padding: 12px 0">Size guide</a>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{sizes}}" as="z" hint-placeholder-count="6">
<button type="button" aria-pressed="{{z.on}}" onClick="{{z.pick}}" style="height: 48px; border: 1px solid {{z.border}}; background: {{z.bg}}; color: {{z.fg}}; font-family: 'IBM Plex Mono', monospace; font-size: 13px; cursor: pointer">{{z.label}}</button>
</sc-for>
</div>
</fieldset>

<div style="border-top: 1px solid #CFCFCB">
<sc-for list="{{acc}}" as="a" hint-placeholder-count="3">
<div style="border-bottom: 1px solid #CFCFCB">
<button type="button" aria-expanded="{{a.on}}" onClick="{{a.toggle}}" style="width: 100%; height: 56px; display: flex; align-items: center; justify-content: space-between; background: none; border: 0; padding: 0; color: #0B0B0C; font-family: 'Archivo', sans-serif; font-size: 12px; font-weight: 700; font-stretch: 112%; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer"><span>{{a.title}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 400">{{a.sign}}</span></button>
<sc-if value="{{a.on}}" hint-placeholder-val="{{false}}">
<p style="margin: 0 0 18px; font-size: 14px; line-height: 1.6; color: #3A3A3E">{{a.body}}</p>
</sc-if>
</div>
</sc-for>
</div>
</main>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 28px; background: #F3F3F1; border-top: 1px solid #D2D2CE">
<button class="press" type="button" onClick="{{add}}" style="width: 100%; height: 56px; border: 0; background: #0B0B0C; color: #F3F3F1; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-family: 'Archivo', sans-serif; font-size: 12px; font-weight: 700; font-stretch: 125%; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer">
<span>{{addLabel}}</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12h16M14 6l6 6-6 6"></path></svg>
</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1560}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { color: 0, size: 2, open: 0, bag: 0 }; }
renderVals() {
const s = this.state;
const colors = [
{ name: 'Void Black', hex: '#0B0B0C', bg: '#E8E8E5' },
{ name: 'Photon White', hex: '#F3F3F1', bg: '#DCDCD8' },
{ name: 'Nebula Grey', hex: '#7C7C81', bg: '#E0E0DC' }
];
const sizes = ['XS', 'S', 'M', 'L', 'XL', 'XXL'];
const acc = [
{ title: 'Details', body: '[Fabric, weight and key features, from your tech pack.]' },
{ title: 'Fit', body: '[Fit notes, e.g. model height and size worn.]' },
{ title: 'Shipping & returns', body: '[Shipping regions, delivery times and return window.]' }
];
return {
bagCount: s.bag,
hasBag: s.bag > 0,
colorName: colors[s.color].name,
swatchBg: colors[s.color].bg,
shots: [{ alt: 'Front' }, { alt: 'Back' }, { alt: 'Detail' }, { alt: 'On body' }],
colors: colors.map((c, i) => ({ ...c, on: i === s.color, ring: i === s.color ? '#0B0B0C' : 'transparent', pick: () => this.setState({ color: i }) })),
sizes: sizes.map((l, i) => ({ label: l, on: i === s.size, bg: i === s.size ? '#0B0B0C' : 'transparent', fg: i === s.size ? '#F3F3F1' : '#0B0B0C', border: i === s.size ? '#0B0B0C' : '#B5B5B0', pick: () => this.setState({ size: i }) })),
acc: acc.map((a, i) => ({ ...a, on: i === s.open, sign: i === s.open ? '−' : '+', toggle: () => this.setState({ open: i === s.open ? -1 : i }) })),
addLabel: s.bag > 0 ? 'Added: ' + sizes[s.size] + ', ' + colors[s.color].name : 'Add to bag, ' + sizes[s.size],
add: () => this.setState({ bag: s.bag + 1 })
};
}
}
</script>
</body>
</html>
