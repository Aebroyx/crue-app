<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CRUE Light Search (mobile)</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F3F3F1;font-family:'Archivo',Helvetica,sans-serif;color:#0B0B0C}
a{color:inherit}a:hover{opacity:.75}
.press:active{transform:scale(.98)}

</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F3F1">
<div role="dialog" aria-label="Search" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: #F3F3F1; border-bottom: 1px solid #D2D2CE; display: flex; flex-direction: column">
<div style="height: 60px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 16px; border-bottom: 1px solid #D2D2CE">
<label for="q" style="display: flex; color: #55555A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</span></label>
<input id="q" type="search" value="{{q}}" onChange="{{onQ}}" placeholder="Search" autocomplete="off" style="flex-grow: 1; min-width: 0; height: 100%; border: 0; background: transparent; color: #0B0B0C; font-family: 'Archivo', sans-serif; font-size: 24px; font-weight: 800; font-stretch: 125%; text-transform: uppercase; letter-spacing: -0.01em; outline-offset: -4px">
<a href="catalog-mobile.html" aria-label="Close search" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #0B0B0C; cursor: pointer; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>
<div style="flex-grow: 1; overflow-y: auto; padding: 28px 16px 40px">
<sc-if value="{{isIdle}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #55555A">Popular searches</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{popular}}" as="t" hint-placeholder-count="4"><button type="button" onClick="{{t.pick}}" style="height: 44px; padding: 0 18px; border: 1px solid #B5B5B0; background: transparent; color: #0B0B0C; font-family: 'Archivo', sans-serif; font-size: 12px; font-weight: 700; font-stretch: 125%; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; text-decoration: none">{{t.label}}</button></sc-for></div></div>
</sc-if>
<sc-if value="{{hasResults}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 20px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #55555A">{{countLabel}}</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 12px"><sc-for list="{{results}}" as="p" hint-placeholder-count="3"><a href="product-mobile.html" style="display: flex; flex-direction: column; gap: 10px; text-decoration: none"><div style="aspect-ratio: 3 / 4; background: #E8E8E5; display: flex; align-items: center; justify-content: center"><img src="/brand/crue-mark-black.png" alt="" style="width: 56px; height: 19px; opacity: 0.1"></div><span style="font-size: 12px; font-weight: 700; font-stretch: 112%; text-transform: uppercase; letter-spacing: 0.04em">{{p.name}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">[PRICE]</span></a></sc-for></div>
<a href="catalog-mobile.html" style="align-self: flex-start; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; text-underline-offset: 6px; padding: 10px 0">View all in shop</a></div>
</sc-if>
<sc-if value="{{noResults}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px"><p style="margin: 0; font-size: 22px; font-weight: 800; font-stretch: 125%; text-transform: uppercase">{{noLabel}}</p><p style="margin: 0; font-size: 14px; color: #3A3A3E">Check the spelling or try one of these.</p><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{popular}}" as="t" hint-placeholder-count="4"><button type="button" onClick="{{t.pick}}" style="height: 44px; padding: 0 18px; border: 1px solid #B5B5B0; background: transparent; color: #0B0B0C; font-family: 'Archivo', sans-serif; font-size: 12px; font-weight: 700; font-stretch: 125%; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; text-decoration: none">{{t.label}}</button></sc-for></div></div>
</sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { q: 'run' }; }
renderVals() {
const s = this.state;
const products = [
{ name: 'Horizon Shell Jacket', cat: 'Layers' },
{ name: 'Singularity Run Tee', cat: 'Tops' },
{ name: 'Orbit Half Tight', cat: 'Bottoms' },
{ name: 'Accretion Split Short', cat: 'Bottoms' },
{ name: 'Event Horizon Long Sleeve', cat: 'Tops' },
{ name: 'Photon Run Cap', cat: 'Accessories' }
];
const q = s.q.trim().toLowerCase();
const results = q ? products.filter((p) => (p.name + ' ' + p.cat).toLowerCase().includes(q)) : [];
const pick = (t) => () => this.setState({ q: t });
return {
q: s.q,
onQ: (e) => this.setState({ q: e.target.value }),
clear: () => this.setState({ q: '' }),
results,
countLabel: results.length + (results.length === 1 ? ' result' : ' results'),
isIdle: !q,
hasResults: !!q && results.length > 0,
noResults: !!q && results.length === 0,
noLabel: 'No results for “' + s.q.trim() + '”',
popular: ['Shell jacket', 'Run tee', 'Tight', 'Short'].map((t) => ({ label: t, pick: pick(t) }))
};
}
}
</script>
</body>
</html>
