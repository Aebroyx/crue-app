<div style="padding: 56px 48px 32px; border-bottom: 1px solid #D2D2CE; display: flex; flex-direction: column; gap: 16px"><nav aria-label="Breadcrumb" style="display: flex; gap: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #55555A"><a href="home-desktop.html" style="text-decoration: none">Home</a><span>/</span><span>Help</span></nav><h1 style="margin: 0; font-size: 64px; line-height: 0.95; font-weight: 800; font-stretch: 125%; text-transform: uppercase">{{title}}</h1><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #55555A">Last updated [DATE]</span></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1400}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { doc: 'Shipping' }; }
renderVals() {
const s = this.state;
const docs = {
Shipping: ['Processing time', 'Delivery regions and times', 'Shipping costs', 'Tracking your order'],
Returns: ['Return window', 'Condition of items', 'How to start a return', 'Refunds and exchanges'],
Privacy: ['What we collect', 'How we use it', 'Cookies', 'Your rights'],
Terms: ['Orders and payment', 'Pricing and availability', 'Intellectual property', 'Governing law']
};
const sections = docs[s.doc].map((h) => ({ h, p: '[Your ' + s.doc.toLowerCase() + ' policy text for “' + h.toLowerCase() + '” goes here. Keep it short and plain.]' }));
return {
title: s.doc === 'Terms' ? 'Terms of service' : s.doc === 'Privacy' ? 'Privacy policy' : s.doc + ' policy',
sections,
docs: Object.keys(docs).map((d) => { const on = d === s.doc; return { label: d, on, fg: on ? '#0B0B0C' : '#55555A', mark: on ? '#0B0B0C' : 'transparent', bg: on ? '#0B0B0C' : 'transparent', cfg: on ? '#F3F3F1' : '#0B0B0C', border: on ? '#0B0B0C' : '#B5B5B0', pick: () => this.setState({ doc: d }) }; })
};
}
}
</script>
