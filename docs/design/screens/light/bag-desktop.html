<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CRUE Light Bag</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F3F3F1;font-family:'Archivo',Helvetica,sans-serif;color:#0B0B0C}
a{color:inherit}a:hover{opacity:.75}
.press:active{transform:scale(.98)}

</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #F3F3F1">
<header style="height: 72px; background: #F3F3F1; border-bottom: 1px solid #D2D2CE; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; padding: 0 48px; box-sizing: border-box">
<nav aria-label="Main" style="display: flex; gap: 28px; font-size: 12px; font-weight: 600; font-stretch: 112%; letter-spacing: 0.12em; text-transform: uppercase"><a href="catalog-desktop.html" aria-current="page" style="text-decoration: underline; text-underline-offset: 8px; text-decoration-thickness: 1px">Shop</a><a href="catalog-desktop.html" style="text-decoration: none">Run</a><a href="catalog-desktop.html" style="text-decoration: none">Train</a><a href="home-desktop.html#drop" style="text-decoration: none">Drops</a><a href="about-desktop.html" style="text-decoration: none">About</a></nav>
<a href="home-desktop.html" aria-label="CRUE home" style="justify-self: center; display: flex"><img src="/brand/crue-wordmark-black.png" alt="CRUE" style="width: 104px; height: 22px; display: block"></a>
<div style="justify-self: end; display: flex; align-items: center; gap: 8px">
<a href="../dark/bag-desktop.html" aria-label="Switch to dark theme" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #0B0B0C; cursor: pointer; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"></path></svg></a>
<a href="search-desktop.html" aria-label="Search" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #0B0B0C; cursor: pointer; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg></a>
<a href="#account" aria-label="Account" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #0B0B0C; cursor: pointer; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></a>
<a href="bag-desktop.html" aria-label="Bag, 2 items" style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 4px; color: #0B0B0C; text-decoration: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 8h14l-1 13H6L5 8z"></path><path d="M9 8V6a3 3 0 016 0v2"></path></svg><span>BAG (2)</span></a>
</div>
</header><div aria-hidden="true" style="padding: 56px 48px; display: flex; flex-direction: column; gap: 32px"><div style="width: 360px; height: 56px; background: #E8E8E5"></div><div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px"><div style="height: 340px; background: #E8E8E5"></div><div style="height: 340px; background: #E8E8E5"></div><div style="height: 340px; background: #E8E8E5"></div><div style="height: 340px; background: #E8E8E5"></div></div><div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px"><div style="height: 340px; background: #E8E8E5"></div><div style="height: 340px; background: #E8E8E5"></div><div style="height: 340px; background: #E8E8E5"></div><div style="height: 340px; background: #E8E8E5"></div></div></div><div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(28,28,26,0.38)"></div><aside role="dialog" aria-label="Bag" style="position: absolute; right: 0; top: 0; width: 460px; height: 900px; border-left: 1px solid #D2D2CE; background: #F3F3F1; display: flex; flex-direction: column">
<div style="height: 72px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 28px; border-bottom: 1px solid #D2D2CE">
<h2 style="margin: 0; font-size: 18px; font-weight: 800; font-stretch: 125%; text-transform: uppercase">Bag ({{count}})</h2>
<a href="catalog-desktop.html" aria-label="Close bag" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #0B0B0C; cursor: pointer; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>
<div style="flex-shrink: 0; background: #E8E8E5; padding: 12px 28px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #3A3A3E">Free shipping over [THRESHOLD]</div>
<sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}">
<ul style="list-style: none; margin: 0; padding: 0 28px; flex-grow: 1; overflow-y: auto">
<sc-for list="{{items}}" as="it" hint-placeholder-count="2">
<li style="display: flex; gap: 16px; padding: 24px 0; border-bottom: 1px solid #D2D2CE">
<div style="width: 96px; height: 128px; flex-shrink: 0; background: #E8E8E5; display: flex; align-items: center; justify-content: center"><img src="/brand/crue-mark-black.png" alt="" style="width: 44px; height: 15px; opacity: 0.1"></div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; gap: 12px"><span style="font-size: 13px; font-weight: 700; font-stretch: 112%; text-transform: uppercase; letter-spacing: 0.04em">{{it.name}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; white-space: nowrap">[PRICE]</span></div>
<span style="font-size: 13px; color: #55555A">{{it.variant}}</span>
<div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between">
<div role="group" aria-label="Quantity" style="display: flex; border: 1px solid #B5B5B0">
<button type="button" onClick="{{it.dec}}" aria-label="Decrease quantity" style="width: 40px; height: 40px; background: none; border: 0; color: #0B0B0C; font-size: 16px; cursor: pointer">&#8722;</button>
<span style="width: 36px; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 13px">{{it.qty}}</span>
<button type="button" onClick="{{it.inc}}" aria-label="Increase quantity" style="width: 40px; height: 40px; background: none; border: 0; color: #0B0B0C; font-size: 16px; cursor: pointer">+</button>
</div>
<button type="button" onClick="{{it.remove}}" style="height: 40px; background: none; border: 0; padding: 0; color: #55555A; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: underline; text-underline-offset: 5px; cursor: pointer">Remove</button>
</div>
</div>
</li>
</sc-for>
</ul>
<div style="flex-shrink: 0; padding: 20px 28px 28px; border-top: 1px solid #D2D2CE; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px; font-weight: 700; font-stretch: 112%; letter-spacing: 0.1em; text-transform: uppercase">Subtotal</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px">[SUBTOTAL]</span></div>
<p style="margin: 0; font-size: 13px; color: #55555A">Shipping and taxes are calculated at checkout.</p>
<a href="#checkout" class="press" style="height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border: 0; background: #0B0B0C; color: #F3F3F1; font-family: 'Archivo', sans-serif; font-size: 12px; font-weight: 700; font-stretch: 125%; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; text-decoration: none"><span>Checkout</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12h16M14 6l6 6-6 6"></path></svg></a>
</div>
</sc-if>
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 0 28px; text-align: center">
<img src="/brand/crue-mark-black.png" alt="" style="width: 120px; height: 40px; opacity: 0.25">
<p style="margin: 0; font-size: 22px; font-weight: 800; font-stretch: 125%; text-transform: uppercase">Your bag is empty</p>
<p style="margin: 0; font-size: 14px; color: #3A3A3E">Nothing pulled in yet.</p>
<a href="catalog-desktop.html" class="press" style="height: 52px; display: flex; align-items: center; padding: 0 28px; border: 0; background: #0B0B0C; color: #F3F3F1; font-family: 'Archivo', sans-serif; font-size: 12px; font-weight: 700; font-stretch: 125%; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; text-decoration: none">Shop all</a>
</div>
</sc-if>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { items: [
{ id: 1, name: 'Horizon Shell Jacket', variant: 'Void Black / M', qty: 1 },
{ id: 2, name: 'Singularity Run Tee', variant: 'Photon White / L', qty: 1 }
] }; }
renderVals() {
const s = this.state;
const set = (items) => this.setState({ items });
const items = s.items.map((it) => ({ ...it,
inc: () => set(s.items.map((x) => x.id === it.id ? { ...x, qty: x.qty + 1 } : x)),
dec: () => set(s.items.map((x) => x.id === it.id ? { ...x, qty: Math.max(1, x.qty - 1) } : x)),
remove: () => set(s.items.filter((x) => x.id !== it.id))
}));
const count = s.items.reduce((n, x) => n + x.qty, 0);
return { items, count, hasItems: items.length > 0, isEmpty: items.length === 0 };
}
}
</script>
</body>
</html>
