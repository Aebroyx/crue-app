<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CRUE Catalog</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0B0B0C;font-family:'Archivo',Helvetica,sans-serif;color:#EDECE8}
a{color:inherit}a:hover{opacity:.75}
.card:hover .shot{background:#1C1C1F}
.shot{transition:background .3s}
.ctl{transition:border-color .2s,color .2s}
.ctl:hover{border-color:#EDECE8}
.textbtn:hover{opacity:.75}
.press:active{transform:scale(.98)}
</style>
</helmet>
<div style="width: 1440px; height: 2000px; background: #0B0B0C; overflow: hidden">

<div style="height: 36px; background: #141416; display: flex; align-items: center; justify-content: center; gap: 32px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase">
<span>Drop 001: Event Horizon, out now</span>
<span style="color: #A1A1A6">Free shipping over [THRESHOLD]</span>
</div>

<header style="height: 72px; border-bottom: 1px solid #1F1F22; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; padding: 0 48px">
<nav aria-label="Main" style="display: flex; gap: 28px; font-size: 12px; font-weight: 600; font-stretch: 112%; letter-spacing: 0.12em; text-transform: uppercase">
<a href="catalog-desktop.html" aria-current="page" style="text-decoration: underline; text-underline-offset: 8px; text-decoration-thickness: 1px">Shop</a>
<a href="catalog-desktop.html" style="text-decoration: none">Run</a>
<a href="catalog-desktop.html" style="text-decoration: none">Train</a>
<a href="home-desktop.html" style="text-decoration: none">Drops</a>
<a href="home-desktop.html" style="text-decoration: none">Journal</a>
</nav>
<a href="home-desktop.html" aria-label="CRUE home" style="justify-self: center; display: flex"><img src="/brand/crue-wordmark-white.png" alt="CRUE" style="width: 104px; height: 22px; display: block"></a>
<div style="justify-self: end; display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="Search" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #EDECE8; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg></button>
<button type="button" aria-label="Account" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: #EDECE8; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></button>
<button type="button" style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 4px; background: none; border: 0; color: #EDECE8; cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 8h14l-1 13H6L5 8z"></path><path d="M9 8V6a3 3 0 016 0v2"></path></svg><span>BAG (0)</span></button>
</div>
</header>

<div style="padding: 56px 48px 24px; border-bottom: 1px solid #1F1F22; display: flex; align-items: flex-end; justify-content: space-between; gap: 48px">
<div style="display: flex; flex-direction: column; gap: 20px">
<nav aria-label="Breadcrumb" style="display: flex; gap: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #A1A1A6">
<a href="home-desktop.html" style="text-decoration: none">Home</a><span>/</span><span>Shop</span>
</nav>
<div style="display: flex; align-items: baseline; gap: 20px">
<h1 style="margin: 0; font-size: 64px; line-height: 0.95; font-weight: 800; font-stretch: 125%; text-transform: uppercase; letter-spacing: -0.01em">{{title}}</h1>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #A1A1A6">{{countLabel}}</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 32px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase">
<button type="button" class="textbtn" onClick="{{toggleFilters}}" aria-expanded="{{filtersOpen}}" style="display: flex; align-items: center; gap: 10px; height: 44px; background: none; border: 0; padding: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; color: #EDECE8; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><rect x="14" y="5" width="4" height="4"></rect><rect x="8" y="15" width="4" height="4"></rect></svg><span>{{filterLabel}}</span></button>
<button type="button" class="textbtn" style="display: flex; align-items: center; gap: 8px; height: 44px; background: none; border: 0; padding: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; color: #EDECE8; cursor: pointer"><span>Sort: Featured</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>
</div>

<main style="display: flex; gap: 48px; padding: 32px 48px 96px">
<sc-if value="{{filtersOpen}}" hint-placeholder-val="{{true}}">
<aside aria-label="Filters" style="width: 240px; flex-shrink: 0; display: flex; flex-direction: column">
<fieldset style="border: 0; margin: 0; padding: 0 0 28px; border-bottom: 1px solid #1F1F22">
<legend style="padding: 0; margin-bottom: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #A1A1A6">Category</legend>
<div style="display: flex; flex-direction: column">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="display: flex; align-items: center; justify-content: space-between; height: 40px; background: none; border: 0; padding: 0; cursor: pointer; font-family: 'Archivo', sans-serif; font-size: 14px; font-weight: 700; font-stretch: 112%; letter-spacing: 0.06em; text-transform: uppercase; color: {{c.fg}}">
<span style="display: flex; align-items: center; gap: 12px"><span style="width: 8px; height: 8px; background: {{c.mark}}"></span><span>{{c.label}}</span></span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 400">{{c.count}}</span>
</button>
</sc-for>
</div>
</fieldset>
<fieldset style="border: 0; margin: 0; padding: 28px 0; border-bottom: 1px solid #1F1F22">
<legend style="float: left; width: 100%; padding: 0; margin-bottom: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #A1A1A6">Size</legend>
<div style="clear: both; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{sizes}}" as="z" hint-placeholder-count="6">
<button type="button" class="ctl" onClick="{{z.pick}}" aria-pressed="{{z.on}}" style="height: 44px; border: 1px solid {{z.border}}; background: {{z.bg}}; color: {{z.fg}}; font-family: 'IBM Plex Mono', monospace; font-size: 13px; cursor: pointer">{{z.label}}</button>
</sc-for>
</div>
</fieldset>
<fieldset style="border: 0; margin: 0; padding: 28px 0; border-bottom: 1px solid #1F1F22">
<legend style="float: left; width: 100%; padding: 0; margin-bottom: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #A1A1A6">Colour</legend>
<div style="clear: both; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{swatches}}" as="w" hint-placeholder-count="3">
<button type="button" onClick="{{w.pick}}" aria-pressed="{{w.on}}" style="display: flex; align-items: center; gap: 14px; height: 44px; background: none; border: 0; padding: 0; cursor: pointer; font-family: 'Archivo', sans-serif; font-size: 14px; color: {{w.fg}}">
<span style="width: 32px; height: 32px; box-sizing: border-box; padding: 3px; border: 1px solid {{w.ring}}"><span style="display: block; width: 24px; height: 24px; background: {{w.hex}}; border: 1px solid #3A3A3E; box-sizing: border-box"></span></span>
<span>{{w.label}}</span>
</button>
</sc-for>
</div>
</fieldset>
<sc-if value="{{anyFilter}}" hint-placeholder-val="{{false}}">
<button type="button" class="textbtn" onClick="{{clearAll}}" style="align-self: flex-start; margin-top: 20px; height: 44px; background: none; border: 0; padding: 0; color: #EDECE8; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: underline; text-underline-offset: 6px; cursor: pointer">Clear all</button>
</sc-if>
</aside>
</sc-if>

<div style="flex-grow: 1; min-width: 0">
<sc-if value="{{hasResults}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: {{gridCols}}; gap: 40px 16px">
<sc-for list="{{shown}}" as="p" hint-placeholder-count="6">
<a class="card" href="product-desktop.html" style="display: flex; flex-direction: column; gap: 16px; text-decoration: none">
<!-- TODO: product shot on dark seamless, 3:4 -->
<div class="shot" style="aspect-ratio: 3 / 4; background: #141416; display: flex; align-items: center; justify-content: center">
<img src="/brand/crue-mark-white.png" alt="" style="width: 110px; height: 37px; opacity: 0.08">
</div>
<div style="display: flex; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700; font-stretch: 112%; text-transform: uppercase; letter-spacing: 0.04em">{{p.name}}</span>
<div style="display: flex; align-items: center; gap: 10px">
<div style="display: flex; gap: 4px">
<sc-for list="{{p.dots}}" as="d" hint-placeholder-count="3">
<span style="width: 10px; height: 10px; background: {{d}}; box-shadow: 0 0 0 1px #3A3A3E"></span>
</sc-for>
</div>
<span style="font-size: 13px; color: #A1A1A6">{{p.meta}}</span>
</div>
</div>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px">[PRICE]</span>
</div>
</a>
</sc-for>
</div>
</sc-if>
<sc-if value="{{noResults}}" hint-placeholder-val="{{false}}">
<div style="height: 480px; background: #141416; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center">
<img src="/brand/crue-mark-white.png" alt="" style="width: 150px; height: 50px; opacity: 0.25">
<p style="margin: 0; font-size: 28px; font-weight: 800; font-stretch: 125%; text-transform: uppercase">Nothing in this orbit</p>
<p style="margin: 0; font-size: 15px; color: #C4C3C0">No pieces match these filters.</p>
<button type="button" class="press" onClick="{{clearAll}}" style="height: 52px; padding: 0 28px; border: 0; background: #EDECE8; color: #0B0B0C; font-family: 'Archivo', sans-serif; font-size: 12px; font-weight: 700; font-stretch: 125%; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer">Clear filters</button>
</div>
</sc-if>
</div>
</main>

<footer style="box-sizing: border-box; background: #0B0B0C; border-top: 1px solid #1F1F22; padding: 48px 48px 40px; display: flex; justify-content: space-between; align-items: flex-end">
<img src="/brand/crue-wordmark-white.png" alt="CRUE" style="width: 160px; height: 34px">
<div style="display: flex; gap: 28px; font-size: 14px">
<a href="#help" style="text-decoration: none">Shipping</a><a href="#help" style="text-decoration: none">Returns</a><a href="#help" style="text-decoration: none">Size guide</a><a href="#help" style="text-decoration: none">Contact</a>
</div>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; color: #8A8A8F">© CRUE [YEAR]</span>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2000}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { open: true, cat: 'All', size: '', colour: '' }; }
renderVals() {
const s = this.state;
const SW = { black: '#0B0B0C', white: '#EDECE8', grey: '#7C7C81' };
const ALL = ['XS', 'S', 'M', 'L', 'XL', 'XXL'];
const products = [
{ name: 'Horizon Shell Jacket', cat: 'Layers', colours: ['black', 'white', 'grey'], sizes: ALL, meta: 'Void Black' },
{ name: 'Singularity Run Tee', cat: 'Tops', colours: ['white', 'black', 'grey'], sizes: ALL, meta: 'Photon White' },
{ name: 'Orbit Half Tight', cat: 'Bottoms', colours: ['black', 'grey'], sizes: ['XS', 'S', 'M', 'L', 'XL'], meta: 'Void Black' },
{ name: 'Accretion Split Short', cat: 'Bottoms', colours: ['grey', 'black', 'white'], sizes: ALL, meta: 'Nebula Grey' },
{ name: 'Event Horizon Long Sleeve', cat: 'Tops', colours: ['black', 'white'], sizes: ALL, meta: 'Void Black' },
{ name: 'Photon Run Cap', cat: 'Accessories', colours: ['white', 'black'], sizes: [], meta: 'Photon White' }
];
const match = (p, ignoreCat) => (ignoreCat || s.cat === 'All' || p.cat === s.cat) && (!s.size || p.sizes.includes(s.size)) && (!s.colour || p.colours.includes(s.colour));
const shown = products.filter((p) => match(p, false)).map((p) => ({ ...p, dots: p.colours.map((c) => SW[c]) }));
const catNames = ['All', 'Tops', 'Bottoms', 'Layers', 'Accessories'];
const colourNames = [['black', 'Void Black'], ['white', 'Photon White'], ['grey', 'Nebula Grey']];
return {
title: s.cat === 'All' ? 'Shop all' : s.cat,
countLabel: '(' + shown.length + ')',
filtersOpen: s.open,
filterLabel: s.open ? 'Hide filters' : 'Show filters',
toggleFilters: () => this.setState({ open: !s.open }),
gridCols: s.open ? 'repeat(3, minmax(0, 1fr))' : 'repeat(4, minmax(0, 1fr))',
shown,
hasResults: shown.length > 0,
noResults: shown.length === 0,
anyFilter: s.cat !== 'All' || !!s.size || !!s.colour,
clearAll: () => this.setState({ cat: 'All', size: '', colour: '' }),
cats: catNames.map((c) => {
const on = c === s.cat;
const n = products.filter((p) => (c === 'All' || p.cat === c) && (!s.size || p.sizes.includes(s.size)) && (!s.colour || p.colours.includes(s.colour))).length;
return { label: c, on, count: n, fg: on ? '#EDECE8' : '#A1A1A6', mark: on ? '#EDECE8' : 'transparent', pick: () => this.setState({ cat: c }) };
}),
sizes: ALL.map((l) => {
const on = l === s.size;
return { label: l, on, bg: on ? '#EDECE8' : 'transparent', fg: on ? '#0B0B0C' : '#EDECE8', border: on ? '#EDECE8' : '#3A3A3E', pick: () => this.setState({ size: on ? '' : l }) };
}),
swatches: colourNames.map(([k, label]) => {
const on = k === s.colour;
return { label, hex: SW[k], on, fg: on ? '#EDECE8' : '#C4C3C0', ring: on ? '#EDECE8' : 'transparent', pick: () => this.setState({ colour: on ? '' : k }) };
})
};
}
}
</script>
</body>
</html>
