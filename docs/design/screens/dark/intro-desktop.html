<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CRUE Intro</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#050506;font-family:'Archivo',Helvetica,sans-serif;color:#F2F1EE}
a{color:#F2F1EE}a:hover{color:#FAF9F6}
.stars{background-image:
radial-gradient(1px 1px at 12% 18%,#fff 50%,transparent 51%),
radial-gradient(1px 1px at 27% 72%,#ddd 50%,transparent 51%),
radial-gradient(1.5px 1.5px at 41% 33%,#fff 50%,transparent 51%),
radial-gradient(1px 1px at 58% 86%,#bbb 50%,transparent 51%),
radial-gradient(1px 1px at 66% 12%,#fff 50%,transparent 51%),
radial-gradient(1.5px 1.5px at 79% 61%,#eee 50%,transparent 51%),
radial-gradient(1px 1px at 88% 24%,#ccc 50%,transparent 51%),
radial-gradient(1px 1px at 7% 54%,#fff 50%,transparent 51%),
radial-gradient(1px 1px at 34% 8%,#aaa 50%,transparent 51%),
radial-gradient(1px 1px at 93% 83%,#fff 50%,transparent 51%),
radial-gradient(1px 1px at 18% 91%,#ddd 50%,transparent 51%),
radial-gradient(1.5px 1.5px at 72% 40%,#fff 50%,transparent 51%);
animation:crue-fade 1.2s ease-out both,crue-pull 18s linear infinite}
.halo{animation:crue-appear 1.6s .3s ease-out both}
.stars2{background-image:
radial-gradient(1px 1px at 10% 20%,#fff 50%,transparent 51%),
radial-gradient(1px 1px at 35% 65%,#ccc 50%,transparent 51%),
radial-gradient(1px 1px at 55% 15%,#eee 50%,transparent 51%),
radial-gradient(1px 1px at 80% 45%,#bbb 50%,transparent 51%),
radial-gradient(1px 1px at 65% 85%,#fff 50%,transparent 51%),
radial-gradient(1px 1px at 20% 90%,#ddd 50%,transparent 51%),
radial-gradient(1px 1px at 92% 75%,#aaa 50%,transparent 51%);
background-size:190px 170px;
animation:crue-fade 1.6s .2s ease-out both,crue-pull 26s linear infinite,crue-twinkle 3.2s ease-in-out infinite alternate}
.stars3{background-image:
radial-gradient(0.8px 0.8px at 15% 30%,#999 50%,transparent 51%),
radial-gradient(0.8px 0.8px at 45% 80%,#bbb 50%,transparent 51%),
radial-gradient(0.8px 0.8px at 70% 10%,#999 50%,transparent 51%),
radial-gradient(0.8px 0.8px at 85% 55%,#aaa 50%,transparent 51%),
radial-gradient(0.8px 0.8px at 30% 50%,#888 50%,transparent 51%);
background-size:97px 83px;
animation:crue-fade 2s .4s ease-out both,crue-pull 40s linear infinite}
@keyframes crue-twinkle{from{filter:brightness(.6)}to{filter:brightness(1.4)}}
.spin{animation-name:crue-spin;animation-timing-function:linear;animation-iteration-count:infinite}
.bh{animation:crue-appear 1.4s .3s ease-out both,crue-collapse 1.3s 2.4s cubic-bezier(.7,0,.2,1) forwards}
.mark{animation:crue-mark 1.6s 2.8s cubic-bezier(.16,1,.3,1) both}
.rise1{animation:crue-rise 1s 3.6s ease-out both}
.rise2{animation:crue-rise 1s 3.9s ease-out both}
.rise3{animation:crue-rise 1s 4.3s ease-out both}
.bar{animation:crue-load 4.3s cubic-bezier(.4,0,.2,1) both}
.enter:hover{background:#F2F1EE;color:#050506}
@keyframes crue-fade{from{opacity:0}to{opacity:1}}
@keyframes crue-pull{0%{transform:scale(1.4);opacity:.2}30%{opacity:1}100%{transform:scale(.6);opacity:.9}}
@keyframes crue-appear{from{opacity:0;transform:scale(1.15)}to{opacity:1;transform:scale(1)}}
@keyframes crue-spin{to{transform:rotate(360deg)}}
@keyframes crue-collapse{to{opacity:0;transform:scale(.3)}}
@keyframes crue-mark{from{opacity:0;transform:scale(2.2);filter:blur(18px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes crue-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes crue-load{from{width:0}to{width:100%}}
@media (prefers-reduced-motion: reduce){.stars,.stars2,.stars3,.halo,.spin,.mark,.rise1,.rise2,.rise3,.bar{animation:none!important}.bh{display:none}.bar{width:100%}}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #050506">
<div class="stars3" style="position: absolute; inset: -20%; opacity: 0.7"></div>
<div class="stars2" style="position: absolute; inset: -20%"></div>
<div class="stars" style="position: absolute; inset: -10%; transform-origin: 50% 50%"></div>
<div class="halo" style="position: absolute; left: 320px; top: 50px; width: 800px; height: 800px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 40%, transparent 70%)"></div>

<div class="bh" style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px">
<div style="position: absolute; left: 170px; top: -100px; width: 1100px; height: 1100px; transform: scaleY(0.13)">
<div class="spin" style="width: 1100px; height: 1100px; border-radius: 50%; animation-duration: {{spinDur}}; filter: blur(3px); background: conic-gradient(from 0deg, transparent 0deg, {{disk}} 40deg, transparent 110deg, {{disk}} 180deg, transparent 250deg, {{disk}} 310deg, transparent 360deg); -webkit-mask: radial-gradient(circle, transparent 22%, #000 24%, #000 42%, transparent 70%); mask: radial-gradient(circle, transparent 22%, #000 24%, #000 42%, transparent 70%); opacity: 0.85"></div>
</div>
<div style="position: absolute; left: 570px; top: 300px; width: 300px; height: 300px; border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(255,255,255,0.7), 0 0 60px 14px rgba(255,255,255,0.22), 0 0 160px 40px rgba(255,255,255,0.08)"></div>
<div style="position: absolute; left: 582px; top: 312px; width: 276px; height: 276px; border-radius: 50%; background: #030304"></div>
<div style="position: absolute; left: 170px; top: 443px; width: 1100px; height: 14px; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.35) 30%, transparent 70%); filter: blur(2px)"></div>
</div>

<div style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px">
<img class="mark" src="/brand/crue-mark-white.png" alt="CRUE mark" style="width: 460px; height: 154px; display: block">
<div style="display: flex; flex-direction: column; align-items: center; gap: 18px">
<img class="rise1" src="/brand/crue-wordmark-white.png" alt="CRUE" style="width: 190px; height: 40px; display: block">
<p class="rise2" style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.32em; text-transform: uppercase; color: #A3A3A8">Get pulled in</p>
</div>
</div>

<div style="position: absolute; left: 48px; right: 48px; top: 36px; display: flex; justify-content: space-between; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #A3A3A8">
<span>Drop 001 / Event Horizon</span>
<button type="button" aria-label="Toggle sound" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 4px; background: none; border: 0; color: #A3A3A8; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M17 9l4 6M21 9l-4 6"></path></svg>
<span>Sound off</span>
</button>
</div>

<div style="position: absolute; left: 48px; right: 48px; bottom: 40px; display: flex; align-items: flex-end; justify-content: space-between; gap: 48px">
<div style="display: flex; flex-direction: column; gap: 12px; width: 320px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #A3A3A8">Crossing the event horizon</span>
<div style="height: 1px; width: 320px; background: rgba(255,255,255,0.15)"><div class="bar" style="height: 1px; background: #F2F1EE"></div></div>
</div>
<div class="rise3" style="display: flex; align-items: center; gap: 28px">
<a href="home-desktop.html" style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #A3A3A8; text-decoration: none; padding: 14px 0">Skip</a>
<a class="enter" href="home-desktop.html" style="display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 28px; border: 1px solid #F2F1EE; font-size: 13px; font-weight: 700; font-stretch: 125%; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; color: #F2F1EE; transition: background .25s, color .25s">
<span>Enter</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12h16M14 6l6 6-6 6"></path></svg>
</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"disk":{"editor":"color","default":"#F4E9DA","options":["#F4E9DA","#FFFFFF","#FFB36B","#9FB8FF"]},"spin":{"editor":"range","default":14,"min":4,"max":40,"step":1,"unit":"s"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {
disk: this.props.disk ?? '#F4E9DA',
spinDur: (this.props.spin ?? 14) + 's'
};
}
}
</script>
</body>
</html>
